name: publish

on:
  workflow_dispatch:
    inputs:
      rc_version:
        description: "RC version to publish (e.g. 0.0.0-rc.5 — must match an existing v<rc> tag). Leave empty to promote the most recent RC."
        required: false
      final_version:
        description: "Final version to publish (default: base of the RC, e.g. 0.0.0)"
        required: false
      bump:
        description: "Version bump for the next release cycle (applied to develop after publish)"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write
  id-token: write

jobs:
  publish-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve RC tag
        id: rc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RC_TAG="${{ inputs.rc_version }}"
          if [ -z "$RC_TAG" ]; then
            RC_TAG="$(gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,isPrerelease \
              --limit 100 \
              --jq '[.[] | select(.isPrerelease) | .tagName] | .[]' \
              | node -e "
                const readline = require('readline');
                const rl = readline.createInterface({ input: process.stdin });
                let best = '', bestKey = '';
                rl.on('line', (line) => {
                  const t = line.trim();
                  const m = t.match(/^v(\d+)\.(\d+)\.(\d+)-rc\.(\d+)$/);
                  if (!m) return;
                  const key = [m[1], m[2], m[3], m[4]].map((x) => x.padStart(6, '0')).join('.');
                  if (key > bestKey) { bestKey = key; best = t; }
                });
                rl.on('close', () => console.log(best));
              ")"

          fi
          if [ -z "$RC_TAG" ] || [ "$RC_TAG" = "null" ]; then
            echo "::error::No RC tag provided and no prerelease found — run the rc workflow first or pass rc_version."
            exit 1
          fi
          echo "tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "Promoting RC tag: $RC_TAG"

      - name: Checkout RC tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.rc.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve final version
        id: version
        run: |
          BASE="$(node -p "require('./packages/package.json').version.split('-')[0]")"
          FINAL="${{ inputs.final_version }}"
          if [ -z "$FINAL" ]; then FINAL="$BASE"; fi
          echo "final=$FINAL" >> "$GITHUB_OUTPUT"
          echo "Publishing v${{ steps.rc.outputs.tag }} as v$FINAL"

      - name: Set final version
        run: npm pkg set version="${{ steps.version.outputs.final }}" --workspace spindlework

      - name: Sync JSR version
        run: |
          node -e "
            const fs = require('fs');
            const p = 'packages/jsr.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = '${{ steps.version.outputs.final }}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Build
        run: npm run build --workspace spindlework

      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured. Add an npm automation token as the NPM_TOKEN repo secret, then re-run."
            exit 1
          fi
          AUTH_USER="$(npm whoami)"
          echo "Authenticated to npm as ${AUTH_USER}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace spindlework

      - name: Publish to JSR
        working-directory: packages
        run: npx --yes jsr publish

      - name: Pack
        run: npm pack --workspace spindlework

      - name: Create stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          RELEASE="v${{ steps.version.outputs.final }}"
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release delete "$RELEASE" --yes
          fi
          gh release create "$RELEASE" spindlework-*.tgz \
            --target "$SHA" \
            --title "spindlework v${{ steps.version.outputs.final }}" \
            --notes "Published from RC v${{ steps.rc.outputs.tag }} (commit $SHA)."

      - name: Bump base version on develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUMP="${{ inputs.bump }}"
          FINAL="${{ steps.version.outputs.final }}"
          if [ "$BUMP" = "none" ]; then
            NEXT="$FINAL"
          else
            NEXT="$(node -e "
              const [maj, min, pat] = process.argv[1].split('.').map(Number);
              const b = process.argv[2];
              const v = b === 'major' ? [maj + 1, 0, 0] : b === 'minor' ? [maj, min + 1, 0] : [maj, min, pat + 1];
              console.log(v.join('.'));
            " "$FINAL" "$BUMP")"
          fi
          echo "Next base version: $NEXT"
          if [ "$NEXT" = "$FINAL" ]; then
            echo "No version bump requested — skipping."
            exit 0
          fi
          git checkout -- packages/package.json packages/jsr.json
          git fetch origin develop
          git checkout -B bump-branch origin/develop
          node -e "
            const fs = require('fs');
            const pkg = 'packages/package.json';
            const jsr = 'packages/jsr.json';
            const a = JSON.parse(fs.readFileSync(pkg, 'utf8'));
            const b = JSON.parse(fs.readFileSync(jsr, 'utf8'));
            a.version = '$NEXT';
            b.version = '$NEXT';
            fs.writeFileSync(pkg, JSON.stringify(a, null, 2) + '\n');
            fs.writeFileSync(jsr, JSON.stringify(b, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/package.json packages/jsr.json
          git commit -m "chore: bump version to $NEXT for the next release cycle"
          git push origin bump-branch:develop

      - name: Merge into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout main
          git merge develop --no-ff -m "Auto-merge {{ steps.version.outputs.final }} -> develop into main"
          git push origin main
